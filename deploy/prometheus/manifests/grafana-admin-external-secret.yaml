# Grafana の admin ユーザーとパスワード.
# chart に任せると helm template (ArgoCD) のたびにランダムなパスワードが生成され
# (grafana chart の lookup が ArgoCD では効かない), Secret / Deployment が常に OutOfSync になり,
# 同期のたびに admin パスワードが変わるため, Vault に固定値を置いて ESO で渡す.
#   Vault 側: eso/grafana-admin の property "admin-user" / "admin-password"
#   参照元: helm/prometheus/values.yaml の grafana.admin.existingSecret (この Secret)
#
# - creationPolicy: Orphan
#     ExternalSecret を削除しても Secret は消えない.
# - refreshInterval: 1h
#     Grafana のデータは emptyDir のため, パスワードは Pod 起動時に反映される.
#     Vault の値を変えた場合は Secret の更新後に Grafana の Pod を再起動する.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: prometheus
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: grafana-admin
    creationPolicy: Orphan
  data:
  - secretKey: admin-user
    remoteRef:
      key: grafana-admin
      property: admin-user
  - secretKey: admin-password
    remoteRef:
      key: grafana-admin
      property: admin-password
