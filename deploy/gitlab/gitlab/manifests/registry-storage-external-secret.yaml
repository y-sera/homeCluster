# Container Registry のストレージ設定 (RustFS)
# 参照元 (values): registry.storage.secret: gitlab-registry-storage / key: config
#   内容は registry 設定ファイルの storage: 配下にそのまま展開される.
#   RustFS はクラスター外に公開しないため, values 側で registry.storage.redirect.disable: true も設定すること.
# ドライバは s3_v2 (AWS SDK v2) を使用する.
#   GitLab 19.0 で旧 s3 ドライバは削除され s3_v2 のエイリアスになるため, 最初から s3_v2 で設定する.
#   S3 互換ストレージ向けの推奨設定 (regionendpoint はスキーム付き URI, pathstyle, checksum_disabled) に従う.
#   https://docs.gitlab.com/update/versions/gitlab_19_changes/
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab-registry-storage
  namespace: gitlab
spec:
  refreshInterval: "15s"
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: gitlab-registry-storage
    template:
      data:
        config: |
          s3_v2:
            bucket: registry
            accesskey: {{ .accessKey | quote }}
            secretkey: {{ .secretKey | quote }}
            region: us-east-1
            regionendpoint: "http://gitlab-rustfs-svc.gitlab.svc:9000"
            pathstyle: true
            checksum_disabled: true
            rootdirectory: /
  data:
  - secretKey: accessKey
    remoteRef:
      key: gitlab-rustfs
      property: access-key
  - secretKey: secretKey
    remoteRef:
      key: gitlab-rustfs
      property: secret-key
