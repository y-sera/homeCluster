# GitLab の rails secret (secrets.yml)
# DB 内の暗号化データ (CI/CD 変数, Runner トークン, 2FA など) の鍵。紛失するとバックアップから復元しても復号できない。
# 元は GitLab chart の shared-secrets Job が生成したもの (2024-08-11)。Vault に退避し、ESO で管理する。
#   Vault 側: eso/gitlab-rails-secret の property "secrets.yml" (secrets.yml の内容そのもの)
#   参照元: chart のデフォルト (global.railsSecrets.secret: <release>-rails-secret) のため values の変更は不要
#
# - creationPolicy: Orphan
#     既存の Secret に ownerReference を付けない。ExternalSecret を削除しても Secret は消えない。
#     クラスター再構築時は ESO が Vault から作成するため、shared-secrets Job による再生成 (別の鍵) を防げる。
# - refreshInterval: 1h
#     値は変更しない前提。Vault 側の誤更新がすぐ反映されないよう間隔を長めにする。
#     (Secret を更新しても Pod は再起動されないため、反映には webservice / sidekiq などの再起動が必要)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab-rails-secret
  namespace: gitlab
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: gitlab-rails-secret
    creationPolicy: Orphan
  data:
  - secretKey: secrets.yml
    remoteRef:
      key: gitlab-rails-secret
      property: secrets.yml
