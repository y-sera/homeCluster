# GitLab Runner の共有キャッシュ用認証情報 (RustFS)
# 参照元 (values): gitlab-runner.runners.cache.secretName: gitlab-runner-cache
#   runner chart は Secret の accesskey / secretkey キーを読み込む (キー名固定).
#   接続先 (ServerAddress: gitlab-rustfs-svc.gitlab.svc:9000, Insecure: true) とバケット (runner-cache) は
#   values の runners.config 側で指定する.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab-runner-cache
  namespace: gitlab
spec:
  refreshInterval: "15s"
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: gitlab-runner-cache
  data:
  - secretKey: accesskey
    remoteRef:
      key: gitlab-rustfs
      property: access-key
  - secretKey: secretkey
    remoteRef:
      key: gitlab-rustfs
      property: secret-key
