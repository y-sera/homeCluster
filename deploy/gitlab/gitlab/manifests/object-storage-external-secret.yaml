# GitLab (Rails) のオブジェクトストレージ接続設定 (RustFS)
# 統合設定 (consolidated) で LFS / artifacts / uploads / packages などの全種別が共通で使用する.
# 参照元 (values): global.appConfig.object_store.connection.secret / key: connection
#                  global.pages.objectStore.connection も同じ Secret を使用できる
# 認証情報は RustFS 本体と同じ Vault キー (eso/gitlab-rustfs) を参照する.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab-object-storage
  namespace: gitlab
spec:
  refreshInterval: "15s"
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: gitlab-object-storage
    template:
      data:
        connection: |
          provider: AWS
          region: us-east-1
          aws_access_key_id: {{ .accessKey | quote }}
          aws_secret_access_key: {{ .secretKey | quote }}
          endpoint: "http://gitlab-rustfs-svc.gitlab.svc:9000"
          path_style: true
  data:
  - secretKey: accessKey
    remoteRef:
      key: gitlab-rustfs
      property: access-key
  - secretKey: secretKey
    remoteRef:
      key: gitlab-rustfs
      property: secret-key
