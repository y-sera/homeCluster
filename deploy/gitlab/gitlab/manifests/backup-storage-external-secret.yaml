# バックアップ (toolbox の backup-utility) 用 s3cmd 設定 (RustFS)
# 参照元 (values): gitlab.toolbox.backups.objectStorage.config.secret: gitlab-backup-storage / key: config
# バケットは global.appConfig.backups.bucket (gitlab-backups) / tmpBucket (tmp) を使用する.
# host_bucket を host_base と同じにしてパス形式 (path style) でアクセスする.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab-backup-storage
  namespace: gitlab
spec:
  refreshInterval: "15s"
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: gitlab-backup-storage
    template:
      data:
        config: |
          [default]
          access_key = {{ .accessKey }}
          secret_key = {{ .secretKey }}
          bucket_location = us-east-1
          host_base = gitlab-rustfs-svc.gitlab.svc:9000
          host_bucket = gitlab-rustfs-svc.gitlab.svc:9000
          use_https = False
          signature_v2 = False
  data:
  - secretKey: accessKey
    remoteRef:
      key: gitlab-rustfs
      property: access-key
  - secretKey: secretKey
    remoteRef:
      key: gitlab-rustfs
      property: secret-key
