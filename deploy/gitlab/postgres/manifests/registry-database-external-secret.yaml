# Container Registry のメタデータ DB (CNPG gitlab-postgres 上の registry DB) のユーザー registry の認証情報
# Vault 側: vault kv put eso/gitlab-registry-database password=$(openssl rand -hex 24)
# - CNPG Cluster (spec.managed.roles[registry].passwordSecret) がロールのパスワードとして使用する (basic-auth 形式)
# - GitLab 側は registry.database.password (key: password) と
#   gitlab.toolbox.backups.registry.database.password (backup / restore とも key: password) で参照する
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab-registry-database
  namespace: gitlab
spec:
  refreshInterval: "15s"
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: gitlab-registry-database
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          # CNPG がパスワード変更を検知して ALTER ROLE するために必要
          cnpg.io/reload: "true"
      data:
        username: registry
        password: "{{ .password }}"
  data:
  - secretKey: password
    remoteRef:
      key: gitlab-registry-database
      property: password
