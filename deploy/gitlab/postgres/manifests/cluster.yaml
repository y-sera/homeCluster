# GitLab 用 PostgreSQL (CloudNativePG)
# 接続先: gitlab-postgres-rw.gitlab.svc:5432 / DB: gitlabhq_production / ユーザー: gitlab
#
# 2026-11-12 に同梱 PostgreSQL (bitnami, 16.6) から initdb.import (microservice 方式) で取り込み済み.
# 取り込み元 (bootstrap.initdb.import / externalClusters) の定義は旧 PostgreSQL の削除に合わせて削除した.
#   手順と結果: memo/gitlab_externalization_runbook.md
# bootstrap は Cluster 作成時のみ使用される. 作り直す場合は空の DB が作成されるため, GitLab のバックアップからリストアする.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: gitlab-postgres
  namespace: gitlab
spec:
  # バックエンドは NAS 1 台のため単一インスタンスとする (Valkey / RustFS と同じ方針)
  instances: 1
  # GitLab 19 は PostgreSQL 17 が必須
  imageName: ghcr.io/cloudnative-pg/postgresql:17.11-standard-trixie

  storage:
    storageClass: qnap-iscsi
    size: 10Gi

  postgresql:
    parameters:
      # 現行は 100 (接続数の実績は 50 前後). webservice / sidekiq の増加に備えて余裕を持たせる
      max_connections: "200"
      shared_buffers: 256MB

  resources:
    requests:
      cpu: 250m
      memory: 512Mi

  # アプリケーション用以外のロール (DB 本体は registry-database.yaml の Database リソースで作成)
  managed:
    roles:
    # Container Registry のメタデータ DB 用
    - name: registry
      ensure: present
      login: true
      passwordSecret:
        name: gitlab-registry-database

  bootstrap:
    initdb:
      database: gitlabhq_production
      owner: gitlab
      secret:
        name: gitlab-postgres-app
