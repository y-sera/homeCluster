# GitLab 用 PostgreSQL (CNPG) のアプリケーションユーザー (gitlab) の認証情報
# Vault 側: vault kv put eso/gitlab-postgres password=$(openssl rand -hex 24)
# - CNPG Cluster (bootstrap.initdb.secret) が gitlab ユーザーのパスワードとして使用する (basic-auth 形式が必須)
# - GitLab 側は global.psql.password.secret: gitlab-postgres-app / key: password で参照する
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab-postgres-app
  namespace: gitlab
spec:
  refreshInterval: "15s"
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: gitlab-postgres-app
    template:
      type: kubernetes.io/basic-auth
      data:
        username: gitlab
        password: "{{ .password }}"
  data:
  - secretKey: password
    remoteRef:
      key: gitlab-postgres
      property: password
