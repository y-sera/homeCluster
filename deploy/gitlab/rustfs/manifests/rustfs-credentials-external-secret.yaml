# GitLab 用 RustFS の管理者 (root) 認証情報。
# Vault 側: vault kv put eso/gitlab-rustfs access-key=<ランダム文字列> secret-key=<ランダム文字列>
# - RustFS chart (secret.existingSecret) が envFrom で読み込む
# - GitLab 側のオブジェクトストレージ接続 Secret (移行時に作成) も同じ Vault キーを参照する
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab-rustfs-credentials
  namespace: gitlab
spec:
  refreshInterval: "15s"
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: gitlab-rustfs-credentials
  data:
  - secretKey: RUSTFS_ACCESS_KEY
    remoteRef:
      key: gitlab-rustfs
      property: access-key
  - secretKey: RUSTFS_SECRET_KEY
    remoteRef:
      key: gitlab-rustfs
      property: secret-key
