apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab-valkey
  namespace: gitlab
spec:
  refreshInterval: "15s"
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: gitlab-valkey
  data:
  - secretKey: default
    remoteRef:
      key: gitlab-valkey
      property: password
