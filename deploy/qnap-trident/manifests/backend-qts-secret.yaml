apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backend-qts-secret
  namespace: trident
spec:
  refreshInterval: "15s"
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: backend-qts-secret
  data:
  - secretKey: username
    remoteRef:
      key: kv/backend-qts-secret
      property: username
  - secretKey: password
    remoteRef:
      key: kv/backend-qts-secret
      property: password
  - secretKey: storageAddress
    remoteRef:
      key: kv/backend-qts-secret
      property: storageAddress
  - secretKey: https
    remoteRef:
      key: kv/backend-qts-secret
      property: https
  - secretKey: port
    remoteRef:
      key: kv/backend-qts-secret
      property: port
