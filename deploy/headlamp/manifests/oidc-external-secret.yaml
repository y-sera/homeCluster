# Headlamp の OIDC 設定 (chart の config.oidc.externalSecret から envFrom で読み込まれる)
# client secret は keycloak namespace 側の ExternalSecret (deploy/keycloak/manifests/oidc/headlamp-external-secret.yaml)
# と同じ Vault キーを参照し、両者の値を一致させる。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: headlamp-oidc
  namespace: headlamp
spec:
  refreshInterval: "15s"
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: headlamp-oidc
    template:
      data:
        OIDC_CLIENT_ID: headlamp
        OIDC_CLIENT_SECRET: "{{ .clientSecret }}"
        OIDC_ISSUER_URL: https://keycloak.cluster.orenet.net/realms/home
        OIDC_SCOPES: profile,email
        OIDC_CALLBACK_URL: https://headlamp.cluster.orenet.net/oidc-callback
        OIDC_USE_PKCE: "true"
  data:
  - secretKey: clientSecret
    remoteRef:
      key: headlamp-oidc
      property: client-secret
