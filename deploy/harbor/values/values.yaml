# Harbor (goharbor/harbor chart) overrides only. Chart defaults are used for
# everything else, including image tags. Chart version is pinned in
# applications/harbor.yaml.

expose:
  type: ingress
  tls:
    enabled: true
    certSource: secret
    secret:
      secretName: harbor-cert
  ingress:
    hosts:
      core: harbor.cluster.orenet.net
    className: cilium

externalURL: https://harbor.cluster.orenet.net

# PVCs are created in advance (deploy/harbor/manifests/pvc.yaml) on qnap-iscsi.
persistence:
  enabled: true
  resourcePolicy: keep
  persistentVolumeClaim:
    registry:
      existingClaim: harbor-registry-data
      storageClass: qnap-iscsi
      size: 100Gi
    jobservice:
      jobLog:
        existingClaim: harbor-jobservice-data
        storageClass: qnap-iscsi
    database:
      existingClaim: harbor-database-data
      storageClass: qnap-iscsi
    redis:
      existingClaim: harbor-redis-data
      storageClass: qnap-iscsi
    trivy:
      existingClaim: harbor-trivy-data
      storageClass: qnap-iscsi
  imageChartStorage:
    type: filesystem

updateStrategy:
  type: Recreate

# secretKey (encrypts values stored in the database; must never change) and the
# initial admin password come from Vault via ESO
# (deploy/harbor/manifests/core-secrets-external-secret.yaml).
existingSecretSecretKey: harbor-core-secrets
existingSecretAdminPassword: harbor-core-secrets

# The chart has no existingSecret option for the internal database password, so
# it stays here. Pinned explicitly so a chart default change cannot break it.
database:
  type: internal
  internal:
    password: "changeit"

core:
  # Component shared secret comes from Vault via ESO
  # (deploy/harbor/manifests/core-secrets-external-secret.yaml).
  existingSecret: harbor-core-secrets
  # Token signing key/cert and CSRF key come from Vault via ESO
  # (deploy/harbor/manifests/core-external-secret.yaml) so renders are deterministic.
  secretName: harbor-core-token
  existingXsrfSecret: harbor-core-token

jobservice:
  secret: "8PXHkwBXuH1r5f55"

registry:
  secret: "KiOv9fRQJ7x0fOWE"
  credentials:
    username: harbor_registry_user
    password: harbor_registry_password
    htpasswdString: "harbor_registry_user:$2a$10$LupgjZjO1drxMwv6RgZwXu.sT.ueMG9Y9OPSGHa0laXao66kFFACy"
