# Harbor core の secretKey / コンポーネント間 secret / 初期 admin パスワード。
# 元は values に平文で書いていたもの (chart が Secret harbor-core に展開していた値) を Vault に退避した。
#   Vault 側: eso/harbor-core の property "secretKey" / "secret" / "HARBOR_ADMIN_PASSWORD"
#   参照元: values の existingSecretSecretKey / core.existingSecret / existingSecretAdminPassword
#
# - secretKey は DB 内の暗号化データ (レプリケーション先の認証情報など) の鍵。
#   値を変えると復号できなくなるため、絶対に変更しないこと。
# - secret は core / jobservice / registry が core との通信に使う (16文字)。
# - HARBOR_ADMIN_PASSWORD は初回起動時の admin パスワードのみに使われる。
# - creationPolicy: Orphan / refreshInterval: 1h は core-external-secret.yaml と同じ考え方。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-core-secrets
  namespace: harbor
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: harbor-core-secrets
    creationPolicy: Orphan
  data:
  - secretKey: secretKey
    remoteRef:
      key: harbor-core
      property: secretKey
  - secretKey: secret
    remoteRef:
      key: harbor-core
      property: secret
  - secretKey: HARBOR_ADMIN_PASSWORD
    remoteRef:
      key: harbor-core
      property: HARBOR_ADMIN_PASSWORD
