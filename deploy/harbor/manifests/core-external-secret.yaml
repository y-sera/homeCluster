# Harbor core のトークン署名用の鍵と証明書、および CSRF キー。
# chart に任せると helm template (ArgoCD) のたびにランダム生成され、常に OutOfSync になり、
# sync のたびに再ログインが必要になるため、Vault に固定値を置いて ESO で渡す。
#   Vault 側: eso/harbor-core の property "tls.key" / "tls.crt" (自己署名, 10年, 2036-11-09 まで) / "CSRF_KEY" (32文字)
#   参照元: values の core.secretName と core.existingXsrfSecret (どちらもこの Secret)
#
# - creationPolicy: Orphan
#     ExternalSecret を削除しても Secret は消えない。
# - refreshInterval: 1h
#     値は変更しない前提。Secret を更新しても Pod は再起動されないため、反映には harbor-core の再起動が必要。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-core-token
  namespace: harbor
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: harbor-core-token
    creationPolicy: Orphan
  data:
  - secretKey: tls.key
    remoteRef:
      key: harbor-core
      property: tls.key
  - secretKey: tls.crt
    remoteRef:
      key: harbor-core
      property: tls.crt
  - secretKey: CSRF_KEY
    remoteRef:
      key: harbor-core
      property: CSRF_KEY
