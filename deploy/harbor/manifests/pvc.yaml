# Harbor PVCs on QNAP (trident iSCSI). Referenced from Harbor values via
# persistence.persistentVolumeClaim.*.existingClaim.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: harbor-registry-data
  namespace: harbor
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: qnap-iscsi
  resources:
    requests:
      storage: 100Gi
---
