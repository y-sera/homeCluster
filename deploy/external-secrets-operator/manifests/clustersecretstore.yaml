# ClusterSecretStore: Vault (KV v2) をバックエンドとするクラスタ共通のシークレットストア。
# 認証はKubernetesネイティブ: ESOコントローラpodのServiceAccount
# (external-secrets-operator@external-secrets-operator) のトークンで
# Vaultの auth/kubernetes にログインする (serviceAccountRef省略=コントローラのSAトークン)。
# - Vault側の設定 (auth backend / role / policy) は deploy/vault/terraform で管理
# - サーバー証明書はLet's Encrypt (公的CA) のため caBundle は不要
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault
spec:
  provider:
    vault:
      server: https://vault.cluster.orenet.net
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets-operator
