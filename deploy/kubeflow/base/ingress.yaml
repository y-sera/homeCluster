# Service istio-ingressgateway (istio-system) の port 80 (http2 -> 8080) へ転送する.
# 認証 (oauth2-proxy) とルーティング (kubeflow-gateway の VirtualService) は Istio 側で行う.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kubeflow
  namespace: istio-system
spec:
  ingressClassName: cilium
  rules:
  - host: kubeflow.cluster.orenet.net
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: istio-ingressgateway
            port:
              number: 80
  tls:
  - hosts:
    - kubeflow.cluster.orenet.net
    secretName: kubeflow-cert
