# Keycloak (realm home) に直接つなぐ設定. upstream base/oauth2_proxy.cfg と common/dex/README.md の Keycloak 例を元にしている.
provider = "oidc"
oidc_issuer_url = "https://keycloak.cluster.orenet.net/realms/home"
provider_display_name = "Keycloak"
# "groups" スコープは要求しない (Keycloak では invalid_scope になる. groups は client の mapper で付与)
scope = "openid profile email"
email_domains = [ "*" ]
code_challenge_method = "S256"

# 認証成功時は 200 を返すだけ (Istio の ext_authz として使う)
upstreams = [ "static://200" ]

# 未認証のバックグラウンド要求はログイン画面へリダイレクトせず 401 を返す
api_routes = [
  "/api/",
  "/apis/",
  "^/ml_metadata",
]

# true にするとログイン画面を挟まず Keycloak へ飛ぶが, トークン失効時に多数のバックグラウンド要求が
# それぞれログインフローを開始して CSRF cookie が溜まるため false (upstream と同じ)
skip_provider_button = false
custom_sign_in_logo = "/custom-theme/kubeflow-logo.svg"
banner = "-"
footer = "-"

# Authorization: Bearer <ID token> を付与し, Istio の RequestAuthentication (dex-jwt) で検証させる
set_authorization_header = true
set_xauthrequest = true

cookie_name = "oauth2_proxy_kubeflow"
# Keycloak の ID token は既定 5 分で失効するため 4 分で refresh する
cookie_refresh = "4m"
cookie_expire = "10h"

redirect_url = "https://kubeflow.cluster.orenet.net/oauth2/callback"
relative_redirect_url = false
