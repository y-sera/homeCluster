# Vault eso/kubeflow-oidc の client-secret / cookie-secret.
# client-secret は Keycloak 側 (deploy/keycloak/manifests/oidc/kubeflow-external-secret.yaml) と同じキーを参照する.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oauth2-proxy-keycloak
  namespace: oauth2-proxy
spec:
  refreshInterval: "15s"
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: oauth2-proxy-keycloak
    template:
      data:
        client-id: kubeflow
        client-secret: "{{ .clientSecret }}"
        cookie-secret: "{{ .cookieSecret }}"
  data:
  - secretKey: clientSecret
    remoteRef:
      key: kubeflow-oidc
      property: client-secret
  - secretKey: cookieSecret
    remoteRef:
      key: kubeflow-oidc
      property: cookie-secret
