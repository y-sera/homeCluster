# science-systems 用 RustFS (単ノード). arXiv の Iceberg warehouse を置く.
# 構成は gitlab 用 RustFS (deploy/gitlab/rustfs) と同じ standalone. chart の既定値との差分のみ記載する.
# - データ領域は事前作成した PVC (manifests/pvc.yaml, qnap-iscsi 18Ti) を使う
# - worker で動かす (ノードは固定しない). qnap-iscsi の PV は Pod が載ったノードに attach される.
#   worker1-3 には QNAP 用の multipath 設定 (no_path_retry 120) が済んでいる.
#   qnap-vm (QNAP 上の VM) は CPU が弱く, 初回のデータ移行で CPU が上限になった (約 49MB/s. worker は約 100MB/s) ため使わない
# - 冗長化は QNAP 側 (RAID) に任せる (単ノード単ディスクのため RustFS の erasure coding は使わない)
mode:
  standalone:
    enabled: true
    # RWO の PVC のため, 新旧の Pod が同時に起動しないようにする
    strategy:
      type: Recreate
      rollingUpdate: null
    existingClaim:
      dataClaim: science-rustfs-data
  distributed:
    enabled: false

secret:
  existingSecret: science-rustfs-credentials

config:
  rustfs:
    # ログはファイルに書かず標準出力のみ (logs 用 PVC を作らない)
    obs_log_directory: ""

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    memory: 4Gi

# クラスタ内 (Polaris / Trino / 取り込みジョブ / Workspace) からのみ使う. コンソールは port-forward で開く
ingress:
  enabled: false
