# RustFS に Polaris 用のユーザー (polaris) とポリシー (arxiv-warehouse-rw) を作る Job.
# polaris-storage の Secret (manifests/polaris-external-secrets.yaml) が SecretSynced になってから手動で apply する:
#   kubectl apply -f deploy/science-systems/polaris/manifests/rustfs-polaris-user-job.yaml
#   kubectl -n science-systems logs job/rustfs-polaris-user
# 再実行する場合は Job を削除してから apply する. 既存のユーザーとポリシーはそのままにする
# (パスワードを変える場合はユーザーを削除してから再実行する).
#
# - Polaris サーバーは metadata.json と manifest を読み書きし, テーブルの削除 (purge) でファイルを消すため,
#   arxiv-warehouse の読み書き・削除を許可する. 他のバケット (arxiv-raw など) は許可しない
# - RustFS の root はこの Job と移行作業のみで使う
apiVersion: v1
kind: ConfigMap
metadata:
  name: rustfs-polaris-user
  namespace: science-systems
data:
  arxiv-warehouse-rw.json: |
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Action": ["s3:GetBucketLocation", "s3:ListBucket", "s3:ListBucketMultipartUploads"],
          "Resource": ["arn:aws:s3:::arxiv-warehouse"]
        },
        {
          "Effect": "Allow",
          "Action": ["s3:GetObject", "s3:PutObject", "s3:DeleteObject", "s3:AbortMultipartUpload", "s3:ListMultipartUploadParts"],
          "Resource": ["arn:aws:s3:::arxiv-warehouse/*"]
        }
      ]
    }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: rustfs-polaris-user
  namespace: science-systems
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: setup
        image: rustfs/rc:v0.1.37
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        env:
        - name: HOME
          value: /tmp
        - name: ENDPOINT
          value: http://science-rustfs-svc.science-systems.svc:9000
        - name: ROOT_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: science-rustfs-credentials
              key: RUSTFS_ACCESS_KEY
        - name: ROOT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: science-rustfs-credentials
              key: RUSTFS_SECRET_KEY
        - name: USER_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: polaris-storage
              key: access-key
        - name: USER_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: polaris-storage
              key: secret-key
        command:
        - sh
        - -ec
        - |
          rc alias set rustfs "$ENDPOINT" "$ROOT_ACCESS_KEY" "$ROOT_SECRET_KEY" >/dev/null
          if rc admin user info rustfs "$USER_ACCESS_KEY" >/dev/null 2>&1; then
            echo "exists : user $USER_ACCESS_KEY"
          else
            rc admin user add rustfs "$USER_ACCESS_KEY" "$USER_SECRET_KEY"
            echo "created: user $USER_ACCESS_KEY"
          fi
          if rc admin policy info rustfs arxiv-warehouse-rw >/dev/null 2>&1; then
            echo "exists : policy arxiv-warehouse-rw"
          else
            rc admin policy create rustfs arxiv-warehouse-rw /policy/arxiv-warehouse-rw.json
            echo "created: policy arxiv-warehouse-rw"
          fi
          rc admin policy attach rustfs arxiv-warehouse-rw --user "$USER_ACCESS_KEY" || echo "(attach skipped: already attached?)"
          echo "--- user info"
          rc admin user info rustfs "$USER_ACCESS_KEY"
          echo "--- check as $USER_ACCESS_KEY"
          rc alias set check "$ENDPOINT" "$USER_ACCESS_KEY" "$USER_SECRET_KEY" >/dev/null
          rc bucket list check
          echo "arxiv-warehouse (allowed):"; rc object list check/arxiv-warehouse/ | head -5
          if rc object list check/arxiv-raw/ >/dev/null 2>&1; then echo "NG: arxiv-raw is readable"; exit 1; else echo "OK: arxiv-raw is denied"; fi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: policy
          mountPath: /policy
          readOnly: true
      volumes:
      - name: tmp
        emptyDir: {}
      - name: policy
        configMap:
          name: rustfs-polaris-user
