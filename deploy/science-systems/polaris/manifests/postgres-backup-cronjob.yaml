# Polaris の目録用 PostgreSQL (polaris-postgres) を毎日 pg_dump して RustFS に保存する CronJob.
# 手動で apply する (Cluster と同じく ArgoCD の管理外):
#   kubectl apply -f deploy/science-systems/polaris/manifests/postgres-backup-cronjob.yaml
# すぐに取る / 動作確認:
#   kubectl -n science-systems create job polaris-postgres-backup-manual --from=cronjob/polaris-postgres-backup
#   kubectl -n science-systems logs -f job/polaris-postgres-backup-manual -c upload
#
# - 保存先: s3://science-backups/polaris-postgres/polaris-YYYYmmddTHHMMSSZ.dump (pg_dump のカスタム形式. 数 MB)
#   バケットがなければ作る. 30 日より古いものは削除する
# - 目録は小さく (2026-11 時点で約 8MB), 失っても metadata.json から register_table で登録し直せるため,
#   WAL を含む継続的なバックアップ (Barman Cloud Plugin) ではなく 1 日 1 回のダンプとする
# - RustFS も PostgreSQL の PV も QNAP 上にあるため, QNAP 自体の故障には備えられない
#   (その場合はテーブルのデータも失われるため, 目録だけ残しても意味がない)
# - 戻し方は memo/polaris_install_memo.md の「目録のバックアップと戻し方」
apiVersion: batch/v1
kind: CronJob
metadata:
  name: polaris-postgres-backup
  namespace: science-systems
spec:
  schedule: "30 3 * * *"
  timeZone: Asia/Tokyo
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 604800
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 26
            runAsGroup: 26
            fsGroup: 26
            seccompProfile:
              type: RuntimeDefault
          initContainers:
          # 1. ダンプ (Cluster と同じイメージ. pg_dump のバージョンをサーバーに合わせる)
          - name: dump
            image: ghcr.io/cloudnative-pg/postgresql:18.7-standard-trixie
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            env:
            - name: PGHOST
              value: polaris-postgres-rw.science-systems.svc
            - name: PGDATABASE
              value: polaris
            - name: PGSSLMODE
              value: require
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: polaris-postgres-app
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: polaris-postgres-app
                  key: password
            command:
            - bash
            - -ec
            - |
              f=/backup/polaris-$(date -u +%Y%m%dT%H%M%SZ).dump
              pg_dump --format=custom --no-owner --no-privileges --file="$f"
              # 読めるダンプかを確認する (目次を数える)
              n=$(pg_restore --list "$f" | wc -l)
              echo "dumped $f ($(stat -c %s "$f") bytes, $n toc lines)"
              [ "$n" -gt 10 ]
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 256Mi
            volumeMounts:
            - name: backup
              mountPath: /backup
          containers:
          # 2. RustFS へ送り, 古いものを消す
          - name: upload
            image: rclone/rclone:1.75.2
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            env:
            - name: HOME
              value: /tmp
            - name: RCLONE_CONFIG
              value: /tmp/rclone.conf
            - name: RCLONE_CONFIG_DST_TYPE
              value: s3
            - name: RCLONE_CONFIG_DST_PROVIDER
              value: Other
            - name: RCLONE_CONFIG_DST_ENDPOINT
              value: http://science-rustfs-svc.science-systems.svc:9000
            - name: RCLONE_CONFIG_DST_REGION
              value: us-east-1
            - name: RCLONE_CONFIG_DST_FORCE_PATH_STYLE
              value: "true"
            # バケットの作成も行うため RustFS の root
            - name: RCLONE_CONFIG_DST_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: science-rustfs-credentials
                  key: RUSTFS_ACCESS_KEY
            - name: RCLONE_CONFIG_DST_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: science-rustfs-credentials
                  key: RUSTFS_SECRET_KEY
            command:
            - sh
            - -ec
            - |
              d=dst:science-backups/polaris-postgres
              rclone mkdir dst:science-backups
              rclone copy /backup "$d"
              rclone delete --min-age 30d "$d"
              rclone ls "$d"
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 256Mi
            volumeMounts:
            - name: backup
              mountPath: /backup
              readOnly: true
            - name: tmp
              mountPath: /tmp
          volumes:
          - name: backup
            emptyDir: {}
          - name: tmp
            emptyDir: {}
