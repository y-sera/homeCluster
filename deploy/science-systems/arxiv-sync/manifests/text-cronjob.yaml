# paper_text (論文ごとに組み立てた TeX) を latex から作り直す CronJob (毎月 16 日 09:00 JST. ソースの取り込み (15 日) の翌日).
#   kubectl -n science-systems create job arxiv-text-manual --from=cronjob/arxiv-text
# - 対象はソースを取り込んだ論文のうち未組み立てのもの (arxiv_sync.text_builds で管理). ソースの取り込みが終わっていなければ次回に回る
# - 組み立て方は src/assemble.py (HF のデータセットの paper_text と同じ方式)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: arxiv-text
  namespace: science-systems
spec:
  schedule: "0 9 16 * *"
  timeZone: Asia/Tokyo
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 604800
      template:
        spec:
          restartPolicy: Never
          # Service のリンク用の環境変数 (TRINO_PORT=tcp://... など) を入れない
          enableServiceLinks: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: text
            image: python:3.14.10-slim-trixie
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            env:
            - name: HOME
              value: /tmp
            - name: PYTHONPATH
              value: /tmp/py:/app
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: TRINO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trino-clients
                  key: admin-password
            # arxiv-raw (manifest の保存) と arxiv-warehouse の両方を使うため RustFS の root
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: science-rustfs-credentials
                  key: RUSTFS_ACCESS_KEY
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: science-rustfs-credentials
                  key: RUSTFS_SECRET_KEY
            command:
            - sh
            - -ec
            - |
              pip install --quiet --no-cache-dir --disable-pip-version-check --target /tmp/py -r /app/requirements.txt
              exec python /app/text.py
            resources:
              requests:
                cpu: 500m
                memory: 1Gi
              limits:
                memory: 6Gi
            volumeMounts:
            - name: app
              mountPath: /app
            - name: tmp
              mountPath: /tmp
          volumes:
          - name: app
            configMap:
              name: arxiv-sync-src
          - name: tmp
            emptyDir: {}
