# ソースを arXiv の S3 (s3://arxiv/src/, requester-pays) から取得して iceberg.arxiv.source / latex / paper_files を更新する CronJob
# (毎月 15 日 09:00 JST. arXiv は月初に前月分の tar を作る).
#   kubectl -n science-systems create job arxiv-source-manual --from=cronjob/arxiv-source
# - 初回のみ, 事前に src_chunks の基準を記録する (README の手順)
# - 転送料がかかる (約 $0.09/GB). 1 回の上限は --max-gb (既定 200GB)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: arxiv-source
  namespace: science-systems
spec:
  schedule: "0 9 15 * *"
  timeZone: Asia/Tokyo
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 604800
      template:
        spec:
          restartPolicy: Never
          # Service のリンク用の環境変数 (TRINO_PORT=tcp://... など) を入れない
          enableServiceLinks: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: source
            image: python:3.14.10-slim-trixie
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            env:
            - name: HOME
              value: /tmp
            - name: PYTHONPATH
              value: /tmp/py:/app
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: TRINO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trino-clients
                  key: admin-password
            # arxiv-raw (manifest の保存) と arxiv-warehouse の両方を使うため RustFS の root
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: science-rustfs-credentials
                  key: RUSTFS_ACCESS_KEY
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: science-rustfs-credentials
                  key: RUSTFS_SECRET_KEY
            # arXiv の S3 (requester-pays) の読み取り専用の認証情報 (manifests/arxiv-aws-external-secret.yaml)
            envFrom:
            - secretRef:
                name: arxiv-aws
            command:
            - sh
            - -ec
            - |
              pip install --quiet --no-cache-dir --disable-pip-version-check --target /tmp/py -r /app/requirements.txt
              exec python /app/source.py
            resources:
              requests:
                cpu: 1
                memory: 2Gi
              limits:
                memory: 12Gi
            volumeMounts:
            - name: app
              mountPath: /app
            - name: tmp
              mountPath: /tmp
          volumes:
          - name: app
            configMap:
              name: arxiv-sync-src
          - name: tmp
            emptyDir: {}
