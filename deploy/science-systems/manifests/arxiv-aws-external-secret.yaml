# arXiv の bulk data (S3 バケット arxiv, us-east-1, requester-pays) を読むための AWS の認証情報.
# Vault 側: vault kv put eso/arxiv-aws access-key-id=<...> secret-access-key=<...>
# 手動で apply する:
#   kubectl apply -f deploy/science-systems/manifests/arxiv-aws-external-secret.yaml
# - IAM ユーザー arxiv-requester-pays. 許可は arxiv の pdf/ と src/ の一覧と読み取りのみ (インラインポリシー arxiv-bulk-read)
# - requester-pays のため転送料はこちらの AWS アカウントの負担. 要求には --request-payer requester
#   (rclone なら --s3-requester-pays) が必要. 全量の取り直しはしない (差分のみ)
# - 環境変数の名前は AWS SDK / CLI / rclone (env_auth) がそのまま読める形
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: arxiv-aws
  namespace: science-systems
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: arxiv-aws
  data:
  - secretKey: AWS_ACCESS_KEY_ID
    remoteRef:
      key: arxiv-aws
      property: access-key-id
  - secretKey: AWS_SECRET_ACCESS_KEY
    remoteRef:
      key: arxiv-aws
      property: secret-access-key
