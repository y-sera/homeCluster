apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-admin
  namespace: keycloak
spec:
  refreshInterval: "15s"
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: keycloak-admin
  data:
  - secretKey: client-id
    remoteRef:
      key: keycloak-operator-admin
      property: client-id
  - secretKey: client-secret
    remoteRef:
      key: keycloak-operator-admin
      property: client-secret
