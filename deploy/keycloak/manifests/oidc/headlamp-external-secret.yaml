apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: headlamp-oidc
  namespace: keycloak
spec:
  refreshInterval: "15s"
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: headlamp-oidc
    template:
      metadata:
        labels:
          # KeycloakOIDCClient から参照するために必須
          operator.keycloak.org/kind: KeycloakOIDCClient
  data:
  - secretKey: client-secret
    remoteRef:
      key: headlamp-oidc
      property: client-secret
