# oauth2-proxy 側 (deploy/kubeflow/oauth2-proxy/external-secret.yaml) と同じ Vault キーを参照する.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kubeflow-oidc
  namespace: keycloak
spec:
  refreshInterval: "15s"
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: kubeflow-oidc
    template:
      metadata:
        labels:
          # KeycloakOIDCClient から参照するために必須
          operator.keycloak.org/kind: KeycloakOIDCClient
  data:
  - secretKey: client-secret
    remoteRef:
      key: kubeflow-oidc
      property: client-secret
