apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakOIDCClient
metadata:
  name: headlamp
  namespace: keycloak
spec:
  keycloakCRName: keycloak
  realm: home
  client:
    enabled: true
    loginFlows:
      - STANDARD
    redirectUris:
      - "https://headlamp.cluster.orenet.net/oidc-callback"
    auth:
      method: client-secret
      secretRef:
        name: headlamp-oidc
        key: client-secret
