apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-password
  namespace: keycloak
spec:
  refreshInterval: "15s"
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: db-password
  data:
  - secretKey: username
    remoteRef:
      key: keycloak-db
      property: username
  - secretKey: password
    remoteRef:
      key: keycloak-db
      property: password
