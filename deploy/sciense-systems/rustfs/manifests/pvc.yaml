# science-systems 用 RustFS のデータ領域 (QNAP, trident iSCSI).
# Iceberg の warehouse (arXiv データセット約 15TB + 増分 約 1.2TB/年) を置く.
# chart には作らせず事前に作成し, values の mode.standalone.existingClaim.dataClaim で参照する
# (ArgoCD の同期や chart の削除でデータ領域が消えないようにするため. StorageClass も Retain).
#   kubectl apply -f deploy/sciense-systems/rustfs/manifests/pvc.yaml
#
# - qnap-iscsi は RWO. RustFS の Pod が載った worker に attach される (values の strategy は Recreate)
# - Pod が載るノードに open-iscsi / multipath-tools と QNAP 用 multipath.conf が必要 (memo/qnap-trident_install_memo.md)
# - 容量は allowVolumeExpansion: true のため後から拡張できる
# - シンプロビジョニング (arxiv-datasets / llm-models と同じ). 確保量ではなく実使用量だけ QNAP の容量を消費する
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: science-rustfs-data
  namespace: science-systems
  annotations:
    trident.qnap.io/ThinAllocate: "true"
    trident.qnap.io/Threshold: "90"
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: qnap-iscsi
  resources:
    requests:
      storage: 18Ti
