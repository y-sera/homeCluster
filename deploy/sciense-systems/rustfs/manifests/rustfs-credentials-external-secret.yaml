# science-systems 用 RustFS の管理者 (root) 認証情報.
# Vault 側: vault kv put eso/science-rustfs access-key=<ランダム文字列> secret-key=<ランダム文字列>
# - RustFS chart (secret.existingSecret) が envFrom で読み込む
# - root はバケット作成など管理用途のみ. Polaris / Trino / 取り込みジョブ用のユーザーは後続の手順で個別に作る
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: science-rustfs-credentials
  namespace: science-systems
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: science-rustfs-credentials
  data:
  - secretKey: RUSTFS_ACCESS_KEY
    remoteRef:
      key: science-rustfs
      property: access-key
  - secretKey: RUSTFS_SECRET_KEY
    remoteRef:
      key: science-rustfs
      property: secret-key
