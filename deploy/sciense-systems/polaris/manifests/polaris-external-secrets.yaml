# Polaris の認証情報 (手動で apply する. Polaris の Application を同期する前に SecretSynced にしておく).
#   kubectl apply -f deploy/sciense-systems/polaris/manifests/polaris-external-secrets.yaml
#
# Vault 側:
#   # トークンの署名鍵 (RSA)
#   openssl genrsa -out private.pem 2048 && openssl rsa -in private.pem -pubout -out public.pem
#   vault kv put eso/polaris-token-keys private-key=@private.pem public-key=@public.pem && rm private.pem public.pem
#   # Polaris の root (realm POLARIS の管理者. client_id は root で固定)
#   vault kv put eso/polaris-root client-secret=$(openssl rand -hex 24)
#   # RustFS のユーザー polaris (Polaris サーバーが metadata.json を読み書きする. 権限は arxiv-warehouse のみ)
#   vault kv put eso/science-rustfs-polaris access-key=polaris secret-key=$(openssl rand -hex 20)

# トークンの署名鍵 (chart の authentication.tokenBroker.secret)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: polaris-token-keys
  namespace: science-systems
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: polaris-token-keys
  data:
  - secretKey: private.pem
    remoteRef:
      key: polaris-token-keys
      property: private-key
  - secretKey: public.pem
    remoteRef:
      key: polaris-token-keys
      property: public-key
---
# root の認証情報 (bootstrap Job と catalog-setup Job が使う)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: polaris-root
  namespace: science-systems
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: polaris-root
    template:
      data:
        client-id: root
        client-secret: "{{ .clientSecret }}"
  data:
  - secretKey: clientSecret
    remoteRef:
      key: polaris-root
      property: client-secret
---
# Polaris サーバーが RustFS に使う認証情報 (chart の storage.secret).
# RustFS 側のユーザーとポリシーは manifests/rustfs-polaris-user-job.yaml で作る
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: polaris-storage
  namespace: science-systems
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: polaris-storage
  data:
  - secretKey: access-key
    remoteRef:
      key: science-rustfs-polaris
      property: access-key
  - secretKey: secret-key
    remoteRef:
      key: science-rustfs-polaris
      property: secret-key
