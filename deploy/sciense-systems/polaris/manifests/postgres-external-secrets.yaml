# Polaris の目録用 PostgreSQL のユーザー (polaris) の認証情報.
# Vault 側: vault kv put eso/polaris-postgres password=$(openssl rand -hex 24)
# 同じパスワードから 2 つの Secret を作る:
# - polaris-postgres-app : CNPG Cluster (bootstrap.initdb.secret) 用. basic-auth 形式が必須
# - polaris-persistence  : Polaris (chart の persistence.relationalJdbc.secret) と bootstrap Job 用. username / password / jdbcUrl
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: polaris-postgres-app
  namespace: science-systems
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: polaris-postgres-app
    template:
      type: kubernetes.io/basic-auth
      data:
        username: polaris
        password: "{{ .password }}"
  data:
  - secretKey: password
    remoteRef:
      key: polaris-postgres
      property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: polaris-persistence
  namespace: science-systems
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: polaris-persistence
    template:
      data:
        username: polaris
        password: "{{ .password }}"
        # currentSchema を URL で指定し, Polaris サーバーと admin tool (bootstrap) で同じスキーマを使う
        jdbcUrl: jdbc:postgresql://polaris-postgres-rw.science-systems.svc:5432/polaris?currentSchema=polaris_schema
  data:
  - secretKey: password
    remoteRef:
      key: polaris-postgres
      property: password
