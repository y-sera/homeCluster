# science-systems 用 Trino. arXiv の Iceberg テーブル (Polaris のカタログ arxiv) を SQL で検索・加工する.
# chart の既定値との差分のみ記載する.
# - カタログ iceberg: Polaris (REST カタログ) の principal trino で目録を操作し, データは RustFS のユーザー trino で直接読み書きする
#   (Polaris は stsUnavailable のため認証情報の払い出しを行わない)
# - 最小構成: coordinator 1 台が worker を兼ねる (server.workers: 0). worker の CPU の空きが少ないため
# - 認証: パスワードファイル (ユーザー admin / mcp_reader). Trino のクライアント (CLI / JDBC / Python) は
#   パスワード認証に HTTPS を必須とするため, Ingress (https://trino.cluster.orenet.net, Let's Encrypt) で TLS を終端し,
#   X-Forwarded-Proto を信頼する (http-server.process-forwarded). クラスタ内のクライアントも Ingress を経由する
# - 認可: ファイルベースのアクセス制御 (accessControl). mcp_reader は読み取りのみで, pdf / source / ps / latex の content 列は読めない
# - 事前に手動で apply するもの: manifests/trino-external-secrets.yaml, rustfs-trino-user-job.yaml, polaris-principal-job.yaml

server:
  workers: 0
  config:
    authenticationType: PASSWORD
    query:
      maxMemory: 3GB

coordinator:
  jvm:
    maxHeapSize: 6G
  config:
    nodeScheduler:
      includeCoordinator: true
    query:
      maxMemoryPerNode: 3GB
  resources:
    requests:
      cpu: 500m
      memory: 6Gi
    limits:
      memory: 8Gi

additionalConfigProperties:
# 認証を有効にするとノード間通信の共有鍵が必須 (Secret trino-internal)
- internal-communication.shared-secret=${ENV:TRINO_SHARED_SECRET}
# Ingress で TLS を終端するため, X-Forwarded-Proto: https の要求を HTTPS として扱う
# (HTTP で直接 Service に来た要求ではパスワード認証を受け付けない)
- http-server.process-forwarded=true

auth:
  # キー password.db (manifests/trino-external-secrets.yaml)
  passwordAuthSecret: trino-password

env:
- name: TRINO_SHARED_SECRET
  valueFrom:
    secretKeyRef:
      name: trino-internal
      key: shared-secret
- name: POLARIS_CREDENTIAL
  valueFrom:
    secretKeyRef:
      name: trino-polaris
      key: credential
- name: RUSTFS_ACCESS_KEY
  valueFrom:
    secretKeyRef:
      name: trino-storage
      key: access-key
- name: RUSTFS_SECRET_KEY
  valueFrom:
    secretKeyRef:
      name: trino-storage
      key: secret-key

catalogs:
  # chart の既定の tpch / tpcds は使わない
  tpch: null
  tpcds: null
  iceberg: |
    connector.name=iceberg
    iceberg.catalog.type=rest
    iceberg.rest-catalog.uri=http://polaris.science-systems.svc:8181/api/catalog
    iceberg.rest-catalog.warehouse=arxiv
    iceberg.rest-catalog.security=OAUTH2
    iceberg.rest-catalog.oauth2.credential=${ENV:POLARIS_CREDENTIAL}
    iceberg.rest-catalog.oauth2.scope=PRINCIPAL_ROLE:ALL
    iceberg.rest-catalog.vended-credentials-enabled=false
    iceberg.file-format=PARQUET
    # 手順 5b: コピー済みの parquet を書き直さずに登録する (ALTER TABLE ... EXECUTE add_files). 既定は無効
    iceberg.add-files-procedure.enabled=true
    fs.s3.enabled=true
    s3.endpoint=http://science-rustfs-svc.science-systems.svc:9000
    s3.region=us-east-1
    s3.path-style-access=true
    s3.aws-access-key=${ENV:RUSTFS_ACCESS_KEY}
    s3.aws-secret-key=${ENV:RUSTFS_SECRET_KEY}

# ファイルベースのアクセス制御 (/etc/trino/access-control/rules.json. 60 秒ごとに読み直す).
# 規則は上から順に評価され, 最初に一致したものが使われる. どれにも一致しなければ拒否する.
# - admin: すべて (テーブルの作成, add_files / unregister_table などのプロシージャ. procedures で明示的に許可が必要)
# - mcp_reader: カタログ iceberg の名前空間 arxiv の SELECT のみ. pdf / source / ps / latex の content 列
#   (論文の本体のバイナリ) は拒否する (SELECT * も失敗するため, 列を指定して問い合わせる)
#   セッションプロパティの変更 (SET SESSION) は admin のみ (mcp_reader の上限を変更させないため)
accessControl:
  type: configmap
  refreshPeriod: 60s
  configFile: rules.json
  rules:
    rules.json: |-
      {
        "catalogs": [
          {"user": "admin", "allow": "all"},
          {"user": "mcp_reader", "catalog": "iceberg", "allow": "read-only"},
          {"catalog": "system", "allow": "read-only"}
        ],
        "schemas": [
          {"user": "admin", "owner": true},
          {"user": "mcp_reader", "catalog": "iceberg", "schema": "arxiv", "owner": false}
        ],
        "tables": [
          {"user": "admin", "privileges": ["SELECT", "INSERT", "DELETE", "UPDATE", "OWNERSHIP", "GRANT_SELECT"]},
          {
            "user": "mcp_reader", "catalog": "iceberg", "schema": "arxiv", "table": "pdf|source|ps|latex",
            "privileges": ["SELECT"],
            "columns": [{"name": "content", "allow": false}]
          },
          {"user": "mcp_reader", "catalog": "iceberg", "schema": "arxiv", "privileges": ["SELECT"]},
          {"catalog": "system", "privileges": ["SELECT"]}
        ],
        "procedures": [
          {"user": "admin", "privileges": ["EXECUTE"]}
        ],
        "system_information": [
          {"user": "admin", "allow": ["read", "write"]}
        ],
        "system_session_properties": [
          {"user": "admin", "allow": true}
        ],
        "catalog_session_properties": [
          {"user": "admin", "allow": true}
        ]
      }

# リソースグループ (/etc/trino/resource-groups/resource-groups.json). 同時実行数, 待ち行列, メモリの上限をユーザーごとに分ける.
# softMemoryLimit の % はクラスタのメモリ (query.maxMemory 3GB) に対する割合.
# - root.admin: 手作業・バッチ (Iceberg テーブルの作成など) 用. 上限はクラスタ全体と同じ
# - root.mcp: mcp_reader (MCP サーバー経由の LLM エージェント). 同時 3 件, 待ち 20 件, メモリ 1GB 程度まで
# - root.other: 上記以外 (現在は使わない)
resourceGroups:
  type: configmap
  resourceGroupsConfig: |-
    {
      "rootGroups": [
        {
          "name": "root",
          "softMemoryLimit": "100%",
          "hardConcurrencyLimit": 10,
          "maxQueued": 100,
          "schedulingPolicy": "fair",
          "subGroups": [
            {"name": "admin", "softMemoryLimit": "100%", "hardConcurrencyLimit": 5, "maxQueued": 50},
            {"name": "mcp", "softMemoryLimit": "35%", "hardConcurrencyLimit": 3, "maxQueued": 20},
            {"name": "other", "softMemoryLimit": "20%", "hardConcurrencyLimit": 1, "maxQueued": 5}
          ]
        }
      ],
      "selectors": [
        {"user": "admin", "group": "root.admin"},
        {"user": "mcp_reader", "group": "root.mcp"},
        {"group": "root.other"}
      ]
    }

# セッションプロパティの既定値 (/etc/trino/session-property-config.json). mcp_reader の問い合わせ 1 件あたりの上限.
# mcp_reader は SET SESSION で変更できない (accessControl の session_properties で admin 以外を拒否).
# - query_max_execution_time: 実行時間 (待ち行列の時間を含まない). 対話的な検索を想定して 60 秒
# - query_max_run_time: 待ち行列を含む全体の時間
# - query_max_scan_physical_bytes: 読み込むデータ量. paper_text (本文, 約 66GB) の全件走査などを防ぐ.
#   metadata (1.6GB) の全件走査はできる大きさにする
# - query_max_memory: 1 件のメモリ (resource group の mcp の上限より小さく)
sessionProperties:
  type: configmap
  sessionPropertiesConfig: |-
    [
      {
        "user": "mcp_reader",
        "sessionProperties": {
          "query_max_execution_time": "60s",
          "query_max_run_time": "120s",
          "query_max_scan_physical_bytes": "8GB",
          "query_max_memory": "800MB"
        }
      }
    ]

ingress:
  enabled: true
  className: cilium
  hosts:
  - host: trino.cluster.orenet.net
    paths:
    - path: /
      pathType: Prefix
  tls:
  - secretName: trino-cert
    hosts:
    - trino.cluster.orenet.net

extraManifests:
- |
  apiVersion: cert-manager.io/v1
  kind: Certificate
  metadata:
    name: trino
    namespace: {{ .Release.Namespace }}
  spec:
    dnsNames:
    - trino.cluster.orenet.net
    duration: 2160h0m0s
    renewBefore: 360h0m0s
    issuerRef:
      group: cert-manager.io
      kind: ClusterIssuer
      name: letsencrypt
    privateKey:
      rotationPolicy: Always
      algorithm: RSA
      size: 2048
    secretName: trino-cert
