# Trino の認証情報 (手動で apply する. Trino の Application を同期する前に SecretSynced にしておく).
#   kubectl apply -f deploy/sciense-systems/trino/manifests/trino-external-secrets.yaml
#
# Vault 側:
#   # Trino のユーザー admin / mcp_reader のパスワードと, Trino のノード間通信の共有鍵
#   vault kv put eso/trino admin-password=$(openssl rand -hex 24) mcp-reader-password=$(openssl rand -hex 24) \
#     shared-secret=$(openssl rand -base64 48 | tr -d '\n')
#   # RustFS のユーザー trino (テーブルのデータの読み書き. 権限は arxiv-warehouse のみ)
#   vault kv put eso/science-rustfs-trino access-key=trino secret-key=$(openssl rand -hex 20)
#
# Polaris の principal trino の認証情報 (Secret trino-polaris) は Vault ではなく
# manifests/polaris-principal-job.yaml が作る (client_id は Polaris が払い出すため)

# パスワードファイル (chart の auth.passwordAuthSecret. キー password.db).
# Trino は bcrypt の $2y$ 形式のみ受け付けるため, sprig の htpasswd ($2a$) の接頭辞を置き換える ($2a$ と $2y$ は同じアルゴリズム).
# htpasswd はソルトを毎回変えるため, 同期のたびに内容が変わらないよう refreshPolicy: CreatedOnce とする.
# パスワードを変えた場合は Secret を削除して作り直す (kubectl -n science-systems delete secret trino-password).
# Trino はファイルの変更を自動で読み直す
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: trino-password
  namespace: science-systems
spec:
  refreshPolicy: CreatedOnce
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: trino-password
    template:
      data:
        password.db: |
          {{ htpasswd "admin" .admin "bcrypt" | replace ":$2a$" ":$2y$" }}
          {{ htpasswd "mcp_reader" .mcpReader "bcrypt" | replace ":$2a$" ":$2y$" }}
  data:
  - secretKey: admin
    remoteRef:
      key: trino
      property: admin-password
  - secretKey: mcpReader
    remoteRef:
      key: trino
      property: mcp-reader-password
---
# Trino のノード間通信の共有鍵 (internal-communication.shared-secret. 認証を有効にすると必須)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: trino-internal
  namespace: science-systems
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: trino-internal
  data:
  - secretKey: shared-secret
    remoteRef:
      key: trino
      property: shared-secret
---
# Trino が RustFS (テーブルのデータ) に使う認証情報.
# RustFS 側のユーザーとポリシーは manifests/rustfs-trino-user-job.yaml で作る
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: trino-storage
  namespace: science-systems
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: trino-storage
  data:
  - secretKey: access-key
    remoteRef:
      key: science-rustfs-trino
      property: access-key
  - secretKey: secret-key
    remoteRef:
      key: science-rustfs-trino
      property: secret-key
---
# Trino のクライアント (MCP サーバー, 移行・取り込みの Job, 動作確認) が使う平文のパスワード.
# 接続先は https://trino.cluster.orenet.net (パスワード認証は HTTPS が必須)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: trino-clients
  namespace: science-systems
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: trino-clients
  data:
  - secretKey: admin-password
    remoteRef:
      key: trino
      property: admin-password
  - secretKey: mcp-reader-password
    remoteRef:
      key: trino
      property: mcp-reader-password
