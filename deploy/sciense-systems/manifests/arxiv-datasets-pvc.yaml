# 削除済み (2026-11-25): PVC arxiv-datasets (SMB, QNAP) は手順 5a のコピーと確認の後に削除した (中身は RustFS の arxiv-warehouse / arxiv-raw).
# 記録として残す. 再び apply しないこと
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: arxiv-datasets
  namespace: science-systems
  annotations: # Required. Define features for your volume.
    trident.qnap.io/Threshold: "90"
    trident.qnap.io/ThinAllocate: "true"

    # I/O synchronization mode. iSCSI only. Accepted values: default, sync, async.
    # "async" is not supported on QTS 6.0 or later and will fail volume creation.
    # trident.qnap.io/IoSyncMode: "default"
spec:
  accessModes:
    - ReadWriteMany # Required. iSCSI: ReadWriteOnce, Samba: ReadWriteMany
  resources:
    requests:
      storage: 17Ti # Required. Specify your resource size.
  storageClassName: qnap-smb # Required. Corresponds to the StorageClass name.
