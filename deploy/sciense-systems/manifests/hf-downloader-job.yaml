apiVersion: batch/v1
kind: Job
metadata:
  name: hf-download
  namespace: science-systems
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      # SMB 上で hf の並列スレッドが同時に mkdir すると EACCES になるため、事前に作成しておく
      initContainers:
        - name: prepare-dirs
          image: harbor.cluster.orenet.net/llm-system/hf-cli:latest
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "mkdir -p /root/data/.cache/huggingface/download"]
          volumeMounts:
            - name: arxiv-datasets
              mountPath: /root/data
      containers:
        - name: hf-cli
          image: harbor.cluster.orenet.net/llm-system/hf-cli:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: HF_TOKEN
            # キャッシュは SMB ではなく Pod ローカルに置く (local-dir のメタデータ置き場と重ならないように)
            - name: HF_HOME
              value: /hf-home
          # ENTRYPOINT が hf なので args にサブコマンド以降を指定
          args:
            - download
            - secemp9/arxiv-complete
            - --repo-type
            - dataset
            - --local-dir
            - /root/data/
          volumeMounts:
            - name: arxiv-datasets
              mountPath: /root/data
            - name: hf-home
              mountPath: /hf-home
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              memory: 2Gi
      volumes:
        - name: arxiv-datasets
          persistentVolumeClaim:
            claimName: arxiv-datasets
        - name: hf-home
          emptyDir: {}
