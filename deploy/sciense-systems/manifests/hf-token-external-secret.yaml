apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hf-token
  namespace:  science-systems
spec:
  refreshInterval: "15s"
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: hf-token
  data:
  - secretKey: HF_TOKEN
    remoteRef:
      key: hf-downloader-token
      property: hf_token
