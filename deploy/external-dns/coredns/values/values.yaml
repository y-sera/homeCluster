# external-dns 用 coredns (coredns/coredns chart) の overrides のみ。
# chart version は applications/external-dns/coredns.yaml で固定。
# クラスター外向けの DNS (192.168.2.64, cilium BGP の lbpool: external-dns から割り当て)。
# kube-system の CoreDNS も cluster.orenet.net をここへ転送している。

replicaCount: 3
isClusterService: false
serviceType: LoadBalancer
customLabels:
  lbpool: external-dns

servers:
- zones:
  - zone: cluster.orenet.net
    use_tcp: true
  port: 53
  plugins:
  - name: errors
  - name: health
    configBlock: |-
      lameduck 10s
  - name: ready
  - name: prometheus
    parameters: 0.0.0.0:9153
  # etcd が停止・再起動中でも、直近 1 時間に引かれたレコードは期限切れでも返す
  # (verify: まず etcd に問い合わせ、失敗したときだけ古いレコードを返す)
  - name: cache
    parameters: 30
    configBlock: |-
      serve_stale 1h verify
  - name: reload
  - name: loadbalance
  - name: etcd
    parameters: cluster.orenet.net
    configBlock: |-
      stubzones
      path /skydns
      endpoint http://etcd:2379
# Kubernetes API サーバーの接続先 (kubeadm control-plane-endpoint, kubeconfig, cilium k8sServiceHost)。
# レコードは Synology の DNS (192.168.1.161) が持つ (実体は kube-vip の VIP 192.168.1.2)。
# cluster.orenet.net ブロックに forward を書いても、プラグインの実行順で etcd が先に NXDOMAIN を返すため、
# より細かいゾーンの専用ブロックで転送する (CoreDNS は最も細かく一致するゾーンのブロックを使う)。
- zones:
  - zone: k8sapiserver.cluster.orenet.net
    use_tcp: true
  port: 53
  plugins:
  - name: errors
  - name: prometheus
    parameters: 0.0.0.0:9153
  - name: cache
    parameters: 30
  - name: forward
    parameters: . 192.168.1.161
- zones:
  - zone: .
  port: 53
  plugins:
  - name: errors
  - name: prometheus
    parameters: 0.0.0.0:9153
  - name: cache
    parameters: 30
  # forward のループ検出 (forward があるのはこのブロックのみ)
  - name: loop
  - name: forward
    parameters: . 192.168.1.1
