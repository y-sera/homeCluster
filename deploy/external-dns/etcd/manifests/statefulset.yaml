apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: etcd
spec:
  serviceName: etcd-headless
  # 3 メンバー (1 台停止まで書き込み可能)。メンバー数を変える場合は --initial-cluster も直し、作り直すこと
  # (稼働中のクラスターに対する replicas の変更だけではメンバーは増減しない)。
  replicas: 3
  # 全メンバーが揃わないと quorum が取れず Ready にならないため、同時に起動する
  podManagementPolicy: Parallel
  template:
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      # メンバーは別々のノードに置く (worker1-3。control-plane と qnap-vm は taint で除外される)
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: etcd
                app.kubernetes.io/instance: external-dns-etcd
      containers:
      - name: etcd
        image: gcr.io/etcd-development/etcd:v3.7.3
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        command:
        - /usr/local/bin/etcd
        args:
        - --name=$(POD_NAME)
        - --data-dir=/var/lib/etcd/data
        - --listen-client-urls=http://0.0.0.0:2379
        - --advertise-client-urls=http://$(POD_NAME).etcd-headless.external-dns.svc.cluster.local:2379
        - --listen-peer-urls=http://0.0.0.0:2380
        - --initial-advertise-peer-urls=http://$(POD_NAME).etcd-headless.external-dns.svc.cluster.local:2380
        # --initial-cluster* はデータディレクトリが空のとき (クラスター作成時) だけ使われる
        - --initial-cluster=etcd-0=http://etcd-0.etcd-headless.external-dns.svc.cluster.local:2380,etcd-1=http://etcd-1.etcd-headless.external-dns.svc.cluster.local:2380,etcd-2=http://etcd-2.etcd-headless.external-dns.svc.cluster.local:2380
        - --initial-cluster-state=new
        - --initial-cluster-token=external-dns-etcd
        # /livez, /readyz, /metrics 用 (probe はここを見る)
        - --listen-metrics-urls=http://0.0.0.0:2381
        # 履歴を1時間で compaction し、DB/WAL の肥大化を防ぐ (DNS レコードは履歴不要)
        - --auto-compaction-mode=periodic
        - --auto-compaction-retention=1h
        - --logger=zap
        - --log-outputs=stderr
        ports:
        - name: client
          containerPort: 2379
        - name: peer
          containerPort: 2380
        - name: metrics
          containerPort: 2381
        startupProbe:
          httpGet:
            path: /readyz
            port: metrics
          periodSeconds: 5
          failureThreshold: 60
        livenessProbe:
          httpGet:
            path: /livez
            port: metrics
          periodSeconds: 10
          failureThreshold: 6
        readinessProbe:
          httpGet:
            path: /readyz
            port: metrics
          periodSeconds: 10
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: data
          mountPath: /var/lib/etcd
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: longhorn
      resources:
        requests:
          storage: 1Gi
