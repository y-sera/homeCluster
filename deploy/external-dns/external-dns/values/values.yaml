# external-dns (kubernetes-sigs/external-dns chart) の overrides のみ。
# chart version は applications/external-dns/external-dns.yaml で固定。
# coredns provider: レコードを etcd (/skydns) に書き込み、external-dns 用 coredns が配信する。

provider:
  name: coredns

env:
- name: ETCD_URLS
  value: http://etcd:2379

# hubble など、先に導入したコンポーネントのレコードも更新できるよう sync にする。
policy: sync

sources:
- service
- ingress
- gateway-httproute
- gateway-grpcroute
# gateway-tlsroute は外している: external-dns 0.22 以降は TLSRoute v1 (Gateway API v1.5+) 前提だが、
# クラスタの CRD は v1alpha2/v1alpha3 のみ (Gateway API v1.4.1 experimental)。TLSRoute は未使用。
# Gateway API を v1.5 以上に上げたら戻す。
- gateway-tcproute
- gateway-udproute
