# external-dns (kubernetes-sigs/external-dns chart) の overrides のみ。
# chart version は applications/external-dns/external-dns.yaml で固定。
# coredns provider: レコードを etcd (/skydns) に書き込み、external-dns 用 coredns が配信する。

provider:
  name: coredns

env:
- name: ETCD_URLS
  value: http://etcd:2379

# hubble など、先に導入したコンポーネントのレコードも更新できるよう sync にする。
policy: sync

sources:
- service
- ingress
- gateway-httproute
- gateway-grpcroute
- gateway-tlsroute
- gateway-tcproute
- gateway-udproute
