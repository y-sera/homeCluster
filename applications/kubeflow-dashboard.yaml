# Kubeflow 26.10.0: dashboard (Profile controller, KFAM, PodDefaults を含む). kubeflow-istio / kubeflow-oauth2-proxy / kubeflow-base の後, 他の Kubeflow アプリより先に同期する.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubeflow-dashboard
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://gitlab.cluster.orenet.net/y-sera/homecluster.git
    targetRevision: HEAD
    path: deploy/kubeflow/dashboard
  destination:
    server: "https://kubernetes.default.svc"
    namespace: kubeflow
  syncPolicy:
    syncOptions:
    - ServerSideApply=true
    - SkipDryRunOnMissingResource=true
    - RespectIgnoreDifferences=true
  # cert-manager (cainjector) が埋める caBundle と, 集約型 ClusterRole の rules は差分にしない
  ignoreDifferences:
  - group: admissionregistration.k8s.io
    kind: ValidatingWebhookConfiguration
    jqPathExpressions:
    - .webhooks[]?.clientConfig.caBundle
  - group: admissionregistration.k8s.io
    kind: MutatingWebhookConfiguration
    jqPathExpressions:
    - .webhooks[]?.clientConfig.caBundle
  - group: apiextensions.k8s.io
    kind: CustomResourceDefinition
    jsonPointers:
    - /spec/conversion/webhook/clientConfig/caBundle
    # profiles.kubeflow.org の manifest にある preserveUnknownFields: false は API サーバーが保存しない
    - /spec/preserveUnknownFields
  - group: rbac.authorization.k8s.io
    kind: ClusterRole
    jqPathExpressions:
    - select(.aggregationRule != null) | .rules
