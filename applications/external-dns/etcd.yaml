apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns-etcd
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://gitlab.cluster.orenet.net/y-sera/homecluster.git
    targetRevision: HEAD
    path: deploy/external-dns/etcd/manifests
  destination:
    server: "https://kubernetes.default.svc"
    namespace: external-dns
