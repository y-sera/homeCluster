# Kubeflow 26.10.0: namespace / ClusterRole / kubeflow-gateway / Ingress. kubeflow-istio の後に同期する.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubeflow-base
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://gitlab.cluster.orenet.net/y-sera/homecluster.git
    targetRevision: HEAD
    path: deploy/kubeflow/base
  destination:
    server: "https://kubernetes.default.svc"
    namespace: kubeflow
  syncPolicy:
    syncOptions:
    - ServerSideApply=true
