apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubelet-csr-approver
  namespace: argocd
spec:
  project: default
  sources:
  - repoURL: https://gitlab.cluster.orenet.net/y-sera/homecluster.git
    ref: configs
    targetRevision: HEAD
  - repoURL: https://postfinance.github.io/kubelet-csr-approver
    helm:
      valueFiles:
      - $configs/deploy/kubelet-csr-approver/values/values.yaml
      releaseName: kubelet-csr-approver
    chart: kubelet-csr-approver
    targetRevision: 1.2.15
  destination:
    server: "https://kubernetes.default.svc"
    namespace: kube-system
