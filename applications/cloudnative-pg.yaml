apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudnative-pg
  namespace: argocd
spec:
  project: default
  sources:
  - repoURL: https://gitlab.cluster.orenet.net/y-sera/homecluster.git
    ref: configs
    targetRevision: HEAD
  - repoURL: https://cloudnative-pg.github.io/charts
    helm:
      valueFiles:
      - $configs/deploy/cloudnative-pg/values/values.yaml
      releaseName: cloudnative-pg
    chart: cloudnative-pg
    targetRevision: 0.29.1
  destination:
    server: "https://kubernetes.default.svc"
    namespace: cnpg-system
  syncPolicy:
    syncOptions:
    - ServerSideApply=true
    - CreateNamespace=true
