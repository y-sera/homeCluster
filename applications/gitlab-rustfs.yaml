apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitlab-rustfs
  namespace: argocd
spec:
  project: default
  sources:
  - repoURL: https://gitlab.cluster.orenet.net/y-sera/homecluster.git
    ref: configs
    targetRevision: HEAD
  - repoURL: https://charts.rustfs.com
    helm:
      valueFiles:
      - $configs/deploy/gitlab/rustfs/values/values.yaml
      releaseName: gitlab-rustfs
    chart: rustfs
    targetRevision: 1.0.4
  destination:
    server: "https://kubernetes.default.svc"
    namespace: gitlab
