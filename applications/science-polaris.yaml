apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: science-polaris
  namespace: argocd
spec:
  project: default
  sources:
  - repoURL: https://gitlab.cluster.orenet.net/y-sera/homecluster.git
    ref: configs
    targetRevision: HEAD
  - repoURL: https://downloads.apache.org/polaris/helm-chart
    helm:
      valueFiles:
      - $configs/deploy/sciense-systems/polaris/values/values.yaml
      releaseName: polaris
    chart: polaris
    targetRevision: 1.9.0
  destination:
    server: "https://kubernetes.default.svc"
    namespace: science-systems
