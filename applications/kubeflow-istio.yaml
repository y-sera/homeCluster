# Kubeflow 26.10.0: Istio (CRD / istio-system / istio-cni) と namespace kubeflow, kubeflow-system. kubeflow-oauth2-proxy, kubeflow-base より先に同期する.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubeflow-istio
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://gitlab.cluster.orenet.net/y-sera/homecluster.git
    targetRevision: HEAD
    path: deploy/kubeflow/istio
  destination:
    server: "https://kubernetes.default.svc"
    namespace: istio-system
  syncPolicy:
    syncOptions:
    - ServerSideApply=true
    - SkipDryRunOnMissingResource=true
    - RespectIgnoreDifferences=true
  # istiod が実行時に書き換えるフィールド
  ignoreDifferences:
  - group: admissionregistration.k8s.io
    kind: ValidatingWebhookConfiguration
    jqPathExpressions:
    - .webhooks[]?.clientConfig.caBundle
    - .webhooks[]?.failurePolicy
  - group: admissionregistration.k8s.io
    kind: MutatingWebhookConfiguration
    jqPathExpressions:
    - .webhooks[]?.clientConfig.caBundle
